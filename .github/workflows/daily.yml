name: Daily AI News

on:
  schedule:
    # 北京时间 10:07 = UTC 02:07
    # 故意避开 :00 整点 —— 全世界用 "0 X * * *" 的太多，GitHub 队列拥堵会延迟 30 分钟+
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # token 可写，方便回写 commit
          token: ${{ secrets.GITHUB_TOKEN }}
          # 拉全部历史，避免 rebase 冲突时无 base
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 可选：用 Claude 生成中文一句话摘要
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            pip install anthropic
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run scraper
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_NEWS_MODEL: ${{ vars.AI_NEWS_MODEL }}
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add web/data reports data/seen.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(TZ=Asia/Shanghai date +%F)
          git commit -m "data: ${DATE}"
          # 远端可能有并发改动，拉一下再推
          git pull --rebase --autostash || true
          git push
